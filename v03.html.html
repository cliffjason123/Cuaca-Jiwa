}
function stopBreath(){if(breathTimer)clearInterval(breathTimer);breathTimer=null}
function startBreath(){stopBreath();breathPaused=false;let elapsed=0;const paint=()=>{$('breathLabel').textContent=elapsed<4?tr('Tarik perlahan','Inhale gently'):elapsed<6?tr('Tahan jika nyaman','Hold if comfortable'):tr('Buang perlahan','Exhale gently')};paint();$('breathPause').textContent=tr('Jeda panduan','Pause guide');breathTimer=setInterval(()=>{if(!breathPaused){elapsed=(elapsed+1)%12;paint()}},1000)}
function toggleBreath(){breathPaused=!breathPaused;document.querySelector('.orb')?.classList.toggle('paused',breathPaused);$('breathPause').textContent=breathPaused?tr('Lanjut panduan','Resume guide'):tr('Jeda panduan','Pause guide')}
function renderFactors(){const box=$('factorGrid');box.replaceChildren();GF.forEach(f=>box.append(chip(f[0],tr(f[1],f[2]),state.goodFactors.includes(f[0]),()=>{state.goodFactors=state.goodFactors.includes(f[0])?state.goodFactors.filter(x=>x!==f[0]):f[0]==='unknown'?['unknown']:[...state.goodFactors.filter(x=>x!=='unknown'),f[0]];renderFactors();restoreChip(box,f[0])})))}
function renderClarity(){$('clarityTitle').textContent=['positive','ordinary'].includes(tone())?tr('Ada hal yang kamu kenali dari check-in ini?','Did you notice anything through this check-in?'):tr('Apakah keadaanmu terasa sedikit lebih jelas?','Does your inner state feel a little clearer?');const box=$('clarityList');box.replaceChildren();CL.forEach(c=>{const b=document.createElement('button');b.textContent=tr(c[1],c[2]);b.onclick=()=>chooseClarity(c[0]);box.append(b)})}
function chooseClarity(c){state.clarity=c;go('take')}
function quickFinish(){state.need='note';state.clarity=null;state.action=null;state.followup=false;completeSession()}
function renderTake(){$('takeTitle').textContent=tone()==='positive'?tr('Ingin membawa sedikit kebaikan ke harimu?','Would you like to carry something good into your day?'):tone()==='ordinary'?tr('Cukup sampai di sini, atau satu hal kecil?','Enough for now, or one small thing?'):tr('Apa yang terasa ringan untuk langkah berikutnya?','What feels manageable as a next step?');const box=$('takeChoices');box.replaceChildren();[['self','Untuk diriku','Something for myself','Jeda, nikmati, atau beri ruang.','Pause, savour, or make some space.'],['kind','Untuk orang lain','A kindness for someone else','Hanya jika terasa aman dan kamu punya ruang.','Only if it feels safe and you have the capacity.'],['none','Cukup untuk sekarang','Enough for now','Tidak perlu memilih tindakan.','No action needed.']].forEach(n=>{const b=needButton([n[0],...n.slice(1)]);b.dataset.actionGroup=n[0];b.setAttribute('aria-pressed',String(state.actionGroup===n[0]));b.onclick=()=>{if(n[0]==='none'){state.action=null;state.followup=false;completeSession();return}state.actionGroup=n[0];state.action=null;state.followup=false;renderTake();$('actionDetail').querySelector('h3')?.focus({preventScroll:true})};box.append(b)});renderActionDetail()}
function renderActionDetail(){const box=$('actionDetail');box.replaceChildren();if(!ACTIONS[state.actionGroup])return;const h=document.createElement('h3');h.className='section-label';h.tabIndex=-1;h.textContent=tr('Pilih satu yang terasa cocok','Choose one that fits');box.append(h);const options=document.createElement('div');options.className='chips';box.append(options);ACTIONS[state.actionGroup].forEach(a=>options.append(chip(a[0],tr(a[1],a[2]),state.action?.id===a[0],()=>{state.action={group:state.actionGroup,id:a[0]};renderActionDetail();restoreChip(box,a[0])})));const p=document.createElement('p');p.className='privacy';p.textContent=tr('Pilihan ini akan masuk riwayat. Ini niat, bukan janji; kamu boleh berubah pikiran.','This choice will be added to history. It is an intention, not a promise; you can change your mind.');box.append(p);const label=document.createElement('label');label.className='check';const check=document.createElement('input');check.type='checkbox';check.id='followupChoice';check.checked=state.followup;check.onchange=()=>state.followup=check.checked;label.append(check,document.createTextNode(tr('Tawarkan refleksi singkat saat aku membuka lagi. Tanpa notifikasi.','Offer a brief reflection when I return. No notifications.')));box.append(label);const b=document.createElement('button');b.className='btn primary quick';b.textContent=tr('Selesai, kembali ke hariku','Finish and return to my day');b.disabled=!state.action;b.onclick=completeSession;box.append(b)}
function completeSession(){if(sessionDone||!state.weather)return;finishTone=tone();finishAction=state.action;const rec={id:'cj_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),weather:state.weather,feelings:[...state.feelings],contexts:[...state.contexts],contextDetails:[...state.contextDetails],need:state.need,goodFactors:[...state.goodFactors],clarity:state.clarity,action:state.action,followup:!!state.action&&state.followup,feedback:null,version:3};lastSaved=persist([rec,...sessions()]);sessionDone=true;clearDrafts();state=blank();go('finish')}
function renderFinish(){$('finishTitle').textContent=finishTone==='positive'?tr('Hari yang baik boleh cukup dinikmati.','A good day can simply be enjoyed.'):finishTone==='ordinary'?tr('Hari yang biasa juga layak dicatat.','An ordinary day is worth noting too.'):tr('Terima kasih sudah memberi ruang untuk dirimu.','Thank you for making room for yourself.');$('finishSub').textContent=finishAction?tr('Pilihan kecilmu ada di riwayat. Kamu boleh menutup aplikasi dan kembali ke harimu, tanpa kewajiban.','Your small intention is in history. You can close the app and return to your day, with no obligation.'):tr('Tidak perlu melakukan hal lain di sini. Kamu boleh menutup aplikasi dan kembali ke harimu.','There is nothing else you need to do here. You can close the app and return to your day.');$('saveStatus').textContent=lastSaved?tr('Check-in tersimpan di browser ini. Tulisan sudah dihapus.','Check-in saved in this browser. Writing has been cleared.'):tr('Check-in hanya tercatat sementara. Tidak tersimpan setelah halaman dimuat ulang. Tulisan sudah dihapus.','Check-in recorded temporarily only. It will not survive a reload. Writing has been cleared.')}
function actionLabel(action){const a=ACTIONS[action?.group]?.find(x=>x[0]===action.id);return a?tr(a[1],a[2]):''}
function feedbackPanel(rec){const wrap=document.createElement('div');wrap.className='card followup';const h=document.createElement('h3');h.textContent=tr('Kalau ingin melihat kembali','If you would like to look back');const p=document.createElement('p');p.textContent=actionLabel(rec.action);const note=document.createElement('p');note.className='small-note';note.textContent=tr('Bagaimana rasanya? Belum dilakukan juga tidak apa-apa.','How did it feel? It is okay if you did not do it.');wrap.append(h,p,note);const choices=document.createElement('div');choices.className='chips';FEEDBACK.forEach(f=>choices.append(chip(f[0],tr(f[1],f[2]),false,()=>recordFeedback(rec.id,f[0]))));wrap.append(choices);const dismiss=document.createElement('button');dismiss.className='more';dismiss.textContent=tr('Tutup refleksi ini','Dismiss this reflection');dismiss.onclick=()=>recordFeedback(rec.id,'dismissed');wrap.append(dismiss);return wrap}
function recordFeedback(id,value){persist(sessions().map(x=>x.id===id?{...x,feedback:value}:x));renderHistory();renderHomeFollowup()}
function renderHomeFollowup(){const box=$('homeFollowup');box.replaceChildren();const pending=sessions().find(x=>x.followup&&!x.feedback&&Date.parse(x.date)<visitStart);if(pending)box.append(feedbackPanel(pending))}
function renderHistory(){const s=sessions(),box=$('historyContent');box.replaceChildren();if(!s.length){box.innerHTML=`<div class="empty">${T[lang].empty}</div>`;return}const rated=s.filter(x=>CL.some(c=>c[0]===x.clarity)),clear=rated.filter(x=>['clear','little'].includes(x.clarity)).length;const count=k=>{const m={};s.forEach(x=>(x[k]||[]).forEach(v=>m[v]=(m[v]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]};const fc=count('feelings'),cc=count('contexts'),gf=count('goodFactors');const wc={};s.forEach(x=>wc[x.weather]=(wc[x.weather]||0)+1);const most=Object.entries(wc).sort((a,b)=>b[1]-a[1])[0];
 box.innerHTML=`<div class="card"><h3>${tr('7 check-in terakhir','Last 7 check-ins')}</h3><div class="strip">${s.slice(0,7).reverse().map(x=>`<div class="daydot" role="img" aria-label="${tr(W[x.weather][0],W[x.weather][1])}">${icon(x.weather)}</div>`).join('')}</div></div><div class="summary-grid"><div class="summary-card"><strong>${s.length}</strong><span>${tr('check-in tersimpan','retained check-ins')}</span></div><div class="summary-card"><strong>${rated.length?Math.round(clear/rated.length*100)+'%':'—'}</strong><span>${tr('merasa lebih jelas','reported more clarity')}</span><p class="small-note">${tr('Dari','From')} ${rated.length} ${tr('jawaban penutup','closing responses')}</p></div></div><div class="card"><h3>${tr('Cuaca yang paling sering tercatat','Most recorded weather')}</h3><p>${tr(W[most[0]][0],W[most[0]][1])} · ${most[1]}</p></div>`;
 if(s.length>=3&&(cc||fc||gf)){const p=document.createElement('div');p.className='insight';p.innerHTML=(cc?`${tr('Topik yang sering muncul','Frequent context')}: ${esc(tr(...C[cc[0]]))}. `:'')+(fc?`${tr('Perasaan yang sering tercatat','Frequent feeling')}: ${esc(tr(...F[fc[0]]))}. `:'')+(gf?`${tr('Yang sering terasa mendukung','Often felt supportive')}: ${esc(tr(GF.find(f=>f[0]===gf[0])[1],GF.find(f=>f[0]===gf[0])[2]))}. `:'')+`<small>${T[lang].notCause}</small>`;box.append(p)}
 const acts=s.filter(x=>x.action).slice(0,5);if(acts.length){const wrap=document.createElement('div');wrap.className='card';const h=document.createElement('h3');h.textContent=tr('Niat kecil untuk harimu','Small intentions for your day');wrap.append(h);acts.forEach(x=>{const item=document.createElement('div');item.className='history-item';const strong=document.createElement('strong');strong.textContent=actionLabel(x.action);const p=document.createElement('p');p.className='small-note';const feedback=FEEDBACK.find(f=>f[0]===x.feedback);p.textContent=new Date(x.date).toLocaleDateString(lang==='id'?'id-ID':'en-GB')+(feedback?' · '+tr(feedback[1],feedback[2]):'');item.append(strong,p);wrap.append(item)});box.append(wrap)}const pending=s.find(x=>x.followup&&!x.feedback);if(pending)box.append(feedbackPanel(pending))}
function clearHistory(){if(!confirm(T[lang].confirmClear))return;memorySessions=[];if(storageOK)try{localStorage.removeItem('cj_sessions')}catch{storageOK=false;storageNotice()}renderHistory();renderHomeFollowup()}
const steps=['home','feelings','context','need','support','outcome','take','finish'];
function go(id){captureDrafts();if(!['home','history','help','finish'].includes(id)&&!state.weather)id='home';screen=id;if(id!=='support')stopBreath();document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button').forEach(b=>{const current=b.id==='nav-'+id;b.classList.toggle('active',current);if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const index=steps.indexOf(id);$('progressBar').style.width=index>=0?`${index/(steps.length-1)*100}%`:'0%';({home:()=>{renderWeather();renderHomeFollowup()},feelings:renderFeelings,context:renderContexts,need:renderNeeds,support:renderSupport,outcome:renderClarity,take:renderTake,finish:renderFinish,history:renderHistory}[id]||(()=>{}))();const h=$(id).querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'instant'})}
