<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cuaca Jiwa — V0.6.1</title>
<style>
:root{
  --ink:#23312d;--muted:#72817b;--muted2:#8d9894;--line:rgba(35,49,45,.09);
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.76);--accent:#617b70;
  --bgA:#f7f2e8;--bgB:#e9f0eb;--sun:#efcf72;--cloud:#b7c5c0;
  --ease:cubic-bezier(.2,.8,.2,1);--ease2:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f0e9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(75,111,95,.28);outline-offset:3px}
button:active{transform:scale(.985)}

body[data-weather="sunny"]{--bgA:#fff4dc;--bgB:#edf3e9;--accent:#7a7a55;--sun:#f4ce64;--cloud:#cad8cf}
body[data-weather="okay"]{--bgA:#f7f3e9;--bgB:#eaf1ed;--accent:#617a70;--sun:#e7d184;--cloud:#c4d0cb}
body[data-weather="cloudy"]{--bgA:#f0f2ed;--bgB:#e5ece9;--accent:#667872;--sun:#d6cf9e;--cloud:#aebdb7}
body[data-weather="rainy"]{--bgA:#edf2f1;--bgB:#dce9eb;--accent:#55747c;--sun:#d7d1aa;--cloud:#96adb2}
body[data-weather="stormy"]{--bgA:#e9edec;--bgB:#d9e0e3;--accent:#556b73;--sun:#c9c29a;--cloud:#7f949b}

.atmosphere{position:fixed;inset:0;z-index:-5;overflow:hidden;background:linear-gradient(160deg,var(--bgA),var(--bgB));transition:background 900ms var(--ease)}
.atmosphere:before,.atmosphere:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.85;transition:background 900ms var(--ease),transform 900ms var(--ease)}
.atmosphere:before{width:520px;height:520px;right:-210px;top:-210px;background:radial-gradient(circle,rgba(244,210,115,.34),rgba(244,210,115,0) 69%);animation:ambientA 10s ease-in-out infinite alternate}
.atmosphere:after{width:580px;height:580px;left:-270px;bottom:-280px;background:radial-gradient(circle,rgba(143,183,167,.25),rgba(143,183,167,0) 69%);animation:ambientB 13s ease-in-out infinite alternate}
@keyframes ambientA{to{transform:translate(-22px,30px) scale(1.05)}}
@keyframes ambientB{to{transform:translate(28px,-18px) scale(.96)}}
.weather-layer{position:fixed;inset:0;z-index:-4;pointer-events:none;opacity:0;transition:opacity 700ms ease}
body[data-weather="rainy"] .weather-layer,body[data-weather="stormy"] .weather-layer{opacity:.35}
.rain{position:absolute;inset:-20% 0 0;background-image:repeating-linear-gradient(112deg,transparent 0 32px,rgba(91,125,134,.16) 33px 35px,transparent 36px 76px);background-size:120px 160px;animation:rain 7s linear infinite}
@keyframes rain{to{transform:translate3d(-90px,160px,0)}}
body[data-weather="stormy"] .rain{opacity:.7;animation-duration:5s}

.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(15px + env(safe-area-inset-top)) 20px 11px;background:linear-gradient(to bottom,rgba(248,246,241,.82),rgba(248,246,241,.28),transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:760;letter-spacing:-.03em;font-size:18px}.brandmark{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#f0d77f,#bfd7ca);position:relative;box-shadow:inset -7px -7px 14px rgba(46,72,62,.08)}.brandmark:after{content:"";position:absolute;width:22px;height:9px;border-radius:999px;background:rgba(255,255,255,.88);left:9px;top:11px;box-shadow:-11px 4px 0 rgba(225,235,229,.96)}
.top-actions{display:flex;gap:8px}.mini-btn{border:1px solid var(--line);background:rgba(255,255,255,.46);backdrop-filter:blur(12px);border-radius:999px;min-height:38px;padding:0 13px;color:#566660;font-size:12px;font-weight:700}
main{width:min(100%,720px);margin:0 auto;padding:10px 20px calc(110px + env(safe-area-inset-bottom));flex:1}
.stage{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;padding:16px 0 34px;opacity:1;transform:translateY(0);filter:blur(0);transition:opacity 180ms ease,transform 180ms ease,filter 180ms ease}
.stage.leaving{opacity:0;transform:translateY(-10px);filter:blur(3px)}
.stage.entering{animation:stageIn 460ms var(--ease2) both}
@keyframes stageIn{0%{opacity:0;transform:translateY(18px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:760;color:#84918c;margin-bottom:12px}
h1,h2,h3{margin:0;letter-spacing:-.045em}h1{font-size:clamp(42px,10vw,61px);line-height:.99;font-weight:720}h2{font-size:clamp(31px,7vw,45px);line-height:1.06;font-weight:700}h3{font-size:19px;line-height:1.2}p{margin:0;color:var(--muted);line-height:1.58}.lede{font-size:17px;margin-top:13px;max-width:580px}.micro{font-size:12.5px;line-height:1.48;color:#7f8c87}

.weather-core-wrap{height:220px;display:grid;place-items:center;position:relative;margin:10px -20px 2px}.weather-core{width:148px;height:148px;border-radius:50%;position:relative;background:radial-gradient(circle at 31% 25%,rgba(255,255,255,.98),rgba(235,222,177,.8) 38%,rgba(173,202,190,.66));box-shadow:0 30px 95px rgba(61,92,80,.14),inset -18px -19px 30px rgba(53,87,73,.05);transition:all 780ms var(--ease2);animation:coreFloat 5s ease-in-out infinite}
@keyframes coreFloat{50%{transform:translateY(-7px) scale(1.015)}}
.weather-core .cloud{position:absolute;width:91px;height:31px;border-radius:999px;background:rgba(250,251,248,.9);left:68px;top:70px;box-shadow:-46px 13px 0 rgba(223,234,228,.96);transition:all 700ms var(--ease2)}
.weather-core .sun-dot{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--sun);left:28px;top:27px;box-shadow:0 0 35px rgba(242,204,91,.28);opacity:.9;transition:all 700ms var(--ease2)}
.weather-core .drops{position:absolute;inset:0;opacity:0;transition:opacity 500ms ease}.weather-core .drops:before,.weather-core .drops:after{content:"";position:absolute;width:2px;height:16px;border-radius:99px;background:rgba(84,125,135,.55);top:103px;transform:rotate(15deg)}.weather-core .drops:before{left:62px;box-shadow:23px 8px 0 rgba(84,125,135,.48),45px -2px 0 rgba(84,125,135,.4)}.weather-core .drops:after{left:82px;top:120px;box-shadow:28px -4px 0 rgba(84,125,135,.45)}
body[data-weather="sunny"] .weather-core{background:radial-gradient(circle at 33% 28%,#fffdf6,#f1d885 42%,#d5e3d7 78%);box-shadow:0 30px 105px rgba(206,171,68,.16),inset -18px -19px 30px rgba(80,92,66,.04)}
body[data-weather="sunny"] .weather-core .cloud{transform:translate(20px,8px) scale(.78);opacity:.55}body[data-weather="sunny"] .weather-core .sun-dot{transform:scale(1.3);left:40px;top:39px}
body[data-weather="cloudy"] .weather-core .sun-dot{opacity:.25;transform:translate(-7px,6px) scale(.8)}body[data-weather="cloudy"] .weather-core .cloud{transform:scale(1.12) translate(-8px,0);background:rgba(225,232,228,.95)}
body[data-weather="rainy"] .weather-core .sun-dot,body[data-weather="stormy"] .weather-core .sun-dot{opacity:.1}body[data-weather="rainy"] .weather-core .cloud,body[data-weather="stormy"] .weather-core .cloud{transform:scale(1.16) translate(-8px,-3px);background:rgba(191,207,207,.96);box-shadow:-46px 13px 0 rgba(173,192,193,.97)}body[data-weather="rainy"] .weather-core .drops,body[data-weather="stormy"] .weather-core .drops{opacity:1}
body[data-weather="stormy"] .weather-core{filter:saturate(.75) brightness(.94)}

.weather-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:4px 0 18px}.weather-btn{border:0;background:transparent;min-height:72px;border-radius:20px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#66756f;transition:transform 220ms var(--ease),background 250ms ease}.weather-btn .w-mini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.42);border:1px solid var(--line);font-size:19px;transition:all 250ms var(--ease)}.weather-btn span{font-size:11.5px;font-weight:690}.weather-btn.selected{background:rgba(255,255,255,.42)}.weather-btn.selected .w-mini{transform:scale(1.1);background:rgba(255,255,255,.86);box-shadow:0 11px 30px rgba(56,83,72,.10)}
.quick-card{width:100%;border:0;background:rgba(35,49,45,.91);color:#fff;border-radius:23px;padding:17px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;box-shadow:0 16px 38px rgba(35,49,45,.14);transition:transform 220ms var(--ease),box-shadow 220ms ease}.quick-card:hover{transform:translateY(-2px);box-shadow:0 20px 45px rgba(35,49,45,.16)}.quick-card strong{display:block;font-size:15px}.quick-card small{display:block;margin-top:4px;opacity:.66;font-size:12.5px}.quick-card .go{font-size:22px;opacity:.8}

.context-strip{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 25px}.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;border:1px solid rgba(35,49,45,.07);background:rgba(255,255,255,.36);font-size:12px;color:#64736d}.pill b{color:#40514b;font-weight:700}
.choice-grid{display:grid;gap:10px;margin-top:26px}.choice{width:100%;border:1px solid rgba(35,49,45,.08);background:rgba(255,255,255,.49);backdrop-filter:blur(16px);border-radius:23px;padding:17px 18px;text-align:left;display:flex;gap:14px;align-items:center;justify-content:space-between;transition:all 230ms var(--ease)}.choice:hover{background:rgba(255,255,255,.69);transform:translateY(-1px)}.choice strong{display:block;font-size:16px;font-weight:690}.choice small{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}.choice .round{width:27px;height:27px;border-radius:50%;border:1px solid rgba(35,49,45,.12);display:grid;place-items:center;flex:0 0 auto;transition:all 220ms var(--ease)}.choice.selected{background:rgba(255,255,255,.78);box-shadow:0 12px 34px rgba(49,72,63,.08);border-color:rgba(74,110,95,.19)}.choice.selected .round{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.04)}
.word-cloud{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.word{border:1px solid rgba(35,49,45,.08);background:rgba(255,255,255,.48);border-radius:999px;padding:12px 15px;font-weight:650;color:#465750;transition:all 220ms var(--ease)}.word.selected{background:#26342f;color:white;border-color:#26342f;box-shadow:0 10px 25px rgba(35,49,45,.12);transform:translateY(-2px)}
.action-row{display:grid;gap:10px;margin-top:28px}.primary,.secondary,.ghost{border:0;border-radius:20px;min-height:55px;padding:0 18px;font-weight:720}.primary{background:#26342f;color:#fff;box-shadow:0 13px 32px rgba(35,49,45,.14)}.primary:disabled{opacity:.32;box-shadow:none}.secondary{background:rgba(255,255,255,.67);border:1px solid var(--line)}.ghost{background:transparent;color:#61716b;min-height:46px}
.micro-response{margin-top:22px;padding:18px 18px 18px 20px;border-left:2px solid rgba(87,123,107,.35);background:linear-gradient(90deg,rgba(255,255,255,.42),rgba(255,255,255,.12));border-radius:0 22px 22px 0;animation:responseIn 520ms var(--ease2) both}.micro-response strong{display:block;font-size:15px;margin-bottom:5px}.micro-response p{font-size:14px;color:#5f6f69}@keyframes responseIn{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:none}}

.source-toggle{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:25px}.source{border:1px solid var(--line);background:rgba(255,255,255,.47);border-radius:22px;padding:18px;text-align:left;min-height:108px;transition:all 240ms var(--ease)}.source strong{display:block;font-size:16px}.source span{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:6px}.source.selected{background:rgba(255,255,255,.81);border-color:rgba(80,113,99,.2);box-shadow:0 13px 35px rgba(55,79,69,.08);transform:translateY(-2px)}
.insight-preview{margin-top:24px;padding:20px;border-radius:25px;background:rgba(255,255,255,.51);border:1px solid var(--line)}.insight-preview .label{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#88958f;font-weight:760}.insight-preview strong{font-size:20px;display:block;margin-top:8px;letter-spacing:-.03em}.insight-preview p{font-size:13.5px;margin-top:7px}

.intervention{margin-top:22px;min-height:450px;display:flex;flex-direction:column;justify-content:center}.breath-center{text-align:center}.breath-orb{width:190px;height:190px;border-radius:50%;margin:28px auto 18px;display:grid;place-items:center;background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.98),rgba(177,208,194,.76));box-shadow:0 30px 95px rgba(62,104,87,.15);transition:transform 4s ease-in-out,box-shadow 4s ease-in-out}.breath-orb.inhale{transform:scale(1.13);box-shadow:0 34px 110px rgba(62,104,87,.2)}.breath-orb.hold{transform:scale(1.13)}.breath-orb.exhale{transform:scale(.84);transition-duration:6s}.breath-orb span{font-size:19px;font-weight:710;color:#49645a}.timer{font-size:13px;color:#7c8a84;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:7px;margin:24px 0 18px}.step-dot{height:4px;flex:1;border-radius:99px;background:rgba(35,49,45,.08)}.step-dot.done,.step-dot.active{background:var(--accent)}
.field{margin-top:18px;padding:18px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.52)}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}.field textarea,.field input{width:100%;border:0;background:transparent;outline:none;resize:none;line-height:1.48;min-height:66px}.field input{min-height:38px}.field .micro{margin-top:7px}
.message-card{margin-top:20px;padding:20px;border-radius:25px;background:rgba(255,255,255,.54);border:1px solid var(--line)}.message-preview{margin-top:13px;padding:16px;border-radius:18px;background:rgba(224,236,229,.7);font-size:14px;line-height:1.5;color:#40524b}.inline-actions{display:flex;gap:9px;margin-top:13px}.small-btn{border:0;background:transparent;padding:8px 0;color:var(--accent);font-weight:720}

.savour-space{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:490px}.savour-orb{width:165px;height:165px;border-radius:50%;margin:30px auto 20px;background:radial-gradient(circle at 31% 26%,#fffef8,#f1d26d 44%,#c9dfd4);box-shadow:0 30px 100px rgba(183,148,47,.16);animation:savourPulse 3.6s var(--ease) infinite alternate}@keyframes savourPulse{to{transform:scale(1.09) translateY(-4px);filter:brightness(1.035);box-shadow:0 34px 110px rgba(183,148,47,.21)}}

.outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.outcome{border:1px solid var(--line);background:rgba(255,255,255,.52);border-radius:20px;padding:17px;text-align:left;font-weight:680}.outcome:last-child{grid-column:1/-1}
.finish{min-height:68dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.finish-core{width:93px;height:93px;border-radius:50%;background:linear-gradient(145deg,#f0d67f,#c2d9ce);box-shadow:0 30px 90px rgba(68,104,89,.13);margin-bottom:25px;animation:finishBreathe 2s var(--ease2) both}@keyframes finishBreathe{0%{transform:scale(.72);opacity:.2}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}

.history-head{margin-bottom:25px}.climate{height:170px;border-radius:28px;background:rgba(255,255,255,.35);border:1px solid var(--line);position:relative;overflow:hidden;margin-top:22px}.climate-sun{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(239,203,99,.72);top:27px;right:47px;box-shadow:0 0 40px rgba(239,203,99,.2)}.climate-cloud{position:absolute;width:110px;height:38px;border-radius:999px;background:rgba(193,208,202,.82);left:47px;top:67px;box-shadow:52px -14px 0 rgba(214,224,219,.88)}.climate-rain{position:absolute;left:74px;top:111px;width:2px;height:22px;background:rgba(81,120,131,.35);transform:rotate(12deg);box-shadow:28px -4px 0 rgba(81,120,131,.32),57px 2px 0 rgba(81,120,131,.3)}
.insight-stack{display:grid;gap:11px;margin-top:20px}.insight-card{padding:19px;border-radius:23px;background:rgba(255,255,255,.5);border:1px solid var(--line)}.insight-card .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#89958f;font-weight:760}.insight-card strong{display:block;margin-top:7px;font-size:18px}.insight-card p{font-size:13.5px;margin-top:6px}
.history-list{margin-top:22px}.history-row{display:flex;justify-content:space-between;gap:14px;padding:15px 2px;border-bottom:1px solid rgba(35,49,45,.07)}.history-row strong{font-size:14px}.history-row span{font-size:12.5px;color:var(--muted);text-align:right}
.notice{margin-top:22px;padding:17px;border-radius:20px;background:rgba(248,237,217,.72);border:1px solid rgba(147,111,67,.13);font-size:13px;line-height:1.55;color:#685944}.resource{display:block;text-decoration:none;color:inherit;margin-top:11px;padding:17px;border-radius:21px;background:rgba(255,255,255,.54);border:1px solid var(--line)}.resource strong{display:block}.resource span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#26342f;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;font-weight:650;transition:all 250ms var(--ease);z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:430px){main{padding-left:18px;padding-right:18px}.weather-core-wrap{height:190px}.weather-core{width:132px;height:132px}.weather-core .cloud{left:60px;top:62px;transform-origin:center}.weather-core .sun-dot{width:38px;height:38px}.weather-btn{min-height:67px}.weather-btn .w-mini{width:34px;height:34px}.weather-btn span{font-size:10.5px}.source-toggle{grid-template-columns:1fr}.topbar{padding-left:17px;padding-right:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* V0.6 refinements */
.date-line{display:inline-block;color:var(--accent);font-weight:650;letter-spacing:-.035em;margin-top:5px}
.home-copy{max-width:650px}.home-copy .lede{max-width:520px}
.quick-soft{margin:9px auto 0;border:1px solid rgba(35,49,45,.08);background:rgba(255,255,255,.38);color:#55665f;border-radius:999px;min-height:44px;padding:0 16px;font-weight:690;display:flex;align-items:center;gap:8px;justify-content:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.quick-soft span{opacity:.62}.quick-soft:hover{background:rgba(255,255,255,.62)}
.word-cloud .word{animation:wordIn .38s var(--ease2) both;animation-delay:calc(var(--i,0)*42ms)}
@keyframes wordIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.combo-card{margin-top:22px;padding:19px 19px 18px;border:1px solid rgba(35,49,45,.07);background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.26));border-radius:25px;box-shadow:0 18px 48px rgba(48,73,63,.07);animation:comboIn .48s var(--ease2) both}
@keyframes comboIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

function weatherName(k){return W[k]?tr(W[k][0],W[k][1]):''}
function feelItem(k,w=state.weather){return (FEEL[w]||[]).find(x=>x[0]===k)}
function feelName(k,w=state.weather){const a=feelItem(k,w);return a?tr(a[1],a[2]):k}
function feelNames(list=state.feelings,w=state.weather){return (list||[]).map(k=>feelName(k,w)).join(' · ')}
function localDate(){const d=new Date();return d.toLocaleDateString(lang==='id'?'id-ID':'en-US',lang==='id'?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'long',month:'long',day:'numeric',year:'numeric'})}

function comboReading(){
 const f=state.feelings;
 if(!f.length)return null;
 if(f.length===1){

  else if(['calm','grateful','connected','relieved','steady','focused','neutral'].includes(k))body=tr('Yang kamu pilih terasa lebih tenang atau stabil. Tidak perlu mencari masalah kalau memang tidak ada yang perlu diperbaiki.','What you chose feels calmer or steadier. There is no need to look for a problem if nothing needs fixing.');

  return {title:tr('Satu cara membacanya','One way to read it'),body,key:k};

 const POS_HIGH=new Set(['happy','joyful','excited','proud']);
 const POS_LOW=new Set(['calm','grateful','connected','relieved','steady','focused']);
 const NEG_HIGH=new Set(['anxious','restless','irritated','angry','overwhelmed','panic','scared','trapped']);
 const NEG_LOW=new Set(['sad','tired','lonely','flat','numb','disappointed','hurt']);
 const hasAny=set=>f.some(x=>set.has(x));
 const posHigh=hasAny(POS_HIGH),posLow=hasAny(POS_LOW),negHigh=hasAny(NEG_HIGH),negLow=hasAny(NEG_LOW);
 const pos=posHigh||posLow,neg=negHigh||negLow;

 } else if(has('angry','hurt')){
  key='anger-hurt';
  body=tr('Marah dan terluka bisa hadir bersama. Kita tidak perlu memilih mana yang “sebenarnya”; mungkin keduanya sedang membawa informasi yang berbeda.','Anger and hurt can coexist. We do not need to choose which one is “the real one”; they may be carrying different information.');
 } else if((f.includes('anxious')||f.includes('restless'))&&f.includes('tired')){

 } else if(has('grateful','tired')){
  key='grateful-tired';

 } else if((f.includes('excited')&&f.includes('restless'))||(f.includes('excited')&&f.includes('anxious'))){
  key='activated-mix';
  body=tr('Ada banyak energi di tubuhmu, tapi arahnya belum sepenuhnya satu: sebagian terasa bersemangat, sebagian terasa tegang. Tubuh kadang terasa mirip pada dua keadaan ini.','There is a lot of activation in your body, but it is not all pointing the same way: some feels exciting, some tense. The body can feel similar in both states.');
 } else if(negHigh&&negLow){
  key='heavy-mixed-energy';

 } else if(posHigh&&posLow){
  key='pleasant-mixed-energy';
  body=tr('Rasa baiknya punya dua kualitas sekaligus: ada bagian yang hidup atau bersemangat, dan ada bagian yang tenang atau terasa cukup. Tidak perlu memilih salah satunya.','The positive feelings have two qualities at once: one part feels lively or energised, while another feels calm or enough. You do not need to choose between them.');
 } else if(negHigh){
  key='unpleasant-active';
  body=tr('Pilihanmu sama-sama cenderung berat dengan energi atau ketegangan yang tinggi. Kita bisa fokus menurunkan intensitas dulu sebelum mencari arti yang lebih jauh.','Your choices all lean heavy with higher activation or tension. We can focus on lowering the intensity before looking for deeper meaning.');
 } else if(negLow){
  key='unpleasant-low';
  body=tr('Pilihanmu sama-sama cenderung berat dengan energi yang lebih rendah. Kita tidak perlu meminta terlalu banyak darimu sekarang.','Your choices all lean heavy with lower energy. We do not need to ask too much of you right now.');
 } else if(posHigh){
  key='pleasant-active';
  body=tr('Rasa yang kamu pilih sama-sama cenderung positif dan cukup berenergi — lebih dekat ke antusias, hidup, atau bersemangat daripada sekadar tenang.','Your selected feelings all lean pleasant and energised — closer to enthusiasm and aliveness than simple calm.');
 } else if(posLow){
  key='pleasant-calm';

function comboHTML(){const c=comboReading();if(!c)return'';if(state.comboFeedback==='no'){state.comboKey=null;return `<div class="combo-card"><div class="label">${tr('Kata-katamu tetap yang utama','Your words stay primary')}</div><strong>${feelNames()}</strong><p>${tr('Oke. Kita tidak akan menyatukan pilihanmu menjadi satu makna. Perasaan ini boleh tetap berdampingan seperti yang kamu pilih.','Okay. We will not collapse your choices into one meaning. These feelings can simply stay side by side as you selected them.')}</p><p class="combo-note">${tr('Cuacaku tetap bisa belajar dari pola perasaan yang berulang tanpa memberi label baru tentang dirimu.','My Weather can still learn from recurring feeling patterns without giving you a new label.')}</p><div class="combo-actions"><button class="tiny-btn" data-combo="reset">${tr('Lihat bacaan sementara lagi','Show the tentative read again')}</button></div></div>`}state.comboKey=c.key;return `<div class="combo-card"><div class="label">${c.title}</div><strong>${feelNames()}</strong><p>${c.body}</p><p class="combo-note">${tr('Ini hanya kemungkinan bacaan, bukan diagnosis. Kamu yang menentukan apakah terasa pas.','This is only a possible reading, not a diagnosis. You decide whether it fits.')}</p><details class="combo-method"><summary>${tr('Kenapa Cuaca Jiwa membacanya seperti ini?','Why does Cuaca Jiwa read it this way?')}</summary><p>${tr('Prototype ini memakai dua dimensi yang umum dalam riset emosi: valensi (lebih nyaman/tidak nyaman) dan aktivasi (energi lebih tinggi/rendah), lalu mempertahankan kemungkinan bahwa beberapa emosi hadir bersamaan.','This prototype uses two common dimensions in emotion research: valence (more pleasant/unpleasant) and activation (higher/lower energy), while allowing several emotions to coexist.')}</p></details>${state.feelings.length>1?`<div class="combo-actions"><button class="tiny-btn ${state.comboFeedback==='fits'?'selected':''}" data-combo="fits">${tr('Cukup pas','Feels close')}</button><butt function renderClarify(step=0,draft=clarifyDraft){clarifyDraft=draft;const data=[{k:'fact',q:tr('Apa yang kamu tahu benar-benar terjadi?','What do you know actually happened?'),ph:tr('Fakta yang bisa kamu pegang…','Facts you can hold onto…')},{k:'fear',q:tr('Apa yang kamu takutkan mungkin terjadi?','What are you afraid might happen?'),ph:tr('Prediksi, kekhawatiran, asumsi…','Predictions, worries, assumptions…')},{k:'control',q:tr('Apa satu hal yang masih dalam kendalimu?','What is one thing still in your control?'),ph:tr('Satu hal kecil yang bisa dilakukan…','One small thing you can do…')}];const x=data[step];stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="eyebrow">${tr('Pikiran lebih jelas','A clearer mind')}</div><h2>${x.q}</h2><p class="lede">${tr('Satu hal saja. Jangan tulis semuanya. Tulisan ini tidak disimpan.','One thing only. Do not write everything. This is not saved.')}</p><div class="stepper">${data.map((_,i)=>`<span class="step-dot ${i<step?'done':i===step?'active':''}"></span>`).join('')}</div><div class="field"><textarea id="clarifyText" maxlength="220" placeholder="${x.ph}">${draft[x.k]||''}</textarea></div><div class="action-row"><button class="primary" id="next" ${draft[x.k]?'':'disabled'}>${step===2?tr('Cukup jelas untuk sekarang','Clear enough for now'):tr('Lanjut satu langkah','One more step')}</button></div>`;$('back').onclick=()=>step===0?change(flowMode==='quick'?renderQuick:renderNeeds):renderClarify(step-1,draft);const ta=$('clarifyText'),next=$('next');ta.oninput=()=>{draft[x.k]=ta.value.trim();next.disabled=!draft[x.k]};next.onclick=()=>{draft[x.k]=ta.value.trim();if(step<2)renderClarify(step+1,draft);else change(renderOutcome)}}
function renderStep(){stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="eyebrow">${tr('Satu langkah','One next step')}</div><h2>${tr('Apa satu hal 5–15 menit yang bisa dilakukan?','What is one thing you can do in 5–15 minutes?')}</h2><p class="lede">${tr('Bukan untuk menyelesaikan semuanya. Hanya membuat langkah berikutnya terlihat.','Not to solve everything. Just make the next step visible.')}</p><div class="field"><input id="stepText" maxlength="150" placeholder="${tr('Contoh: kirim satu email, mandi, buka dokumen…','Example: send one email, shower, open the document…')}"></div><div class="action-row"><button class="primary" id="done" disabled>${tr('Itu langkahku','That is my next step')}</button></div>`;$('back').onclick=()=>change(renderNeeds);const inp=$('stepText'),btn=$('done');inp.oninput=()=>btn.disabled=!inp.value.trim();btn.onclick=()=>change(renderOutcome)}
function renderConnect(){stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="eyebrow">${tr('Terhubung','Connection')}</div><h2>${tr('Kamu tidak harus menjelaskannya dengan sempurna.','You do not need perfect words.')}</h2><p class="lede">${tr('Pilih jenis dukungan yang kamu butuhkan.','Choose the kind of support you need.')}</p><div class="word-cloud"><button class="word" data-support="listen">${tr('Didengarkan','To be heard')}</button><button class="word" data-support="company">${tr('Ditemani','Company')}</button><button class="word" data-support="practical">${tr('Bantuan praktis','Practical help')}</button></div><div id="msg"></div>`;$('back').onclick=()=>change(flowMode==='quick'?renderQuick:renderNeeds);stage.querySelectorAll('[data-support]').forEach(b=>b.onclick=()=>{stage.querySelectorAll('[data-support]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const s=b.dataset.support;const msg=s==='listen'?tr('Hei, aku lagi agak penuh. Kalau kamu punya waktu, aku cuma butuh didengar sebentar.','Hey, I’m feeling a bit overwhelmed. If you have time, I mostly need someone to listen for a moment.'):s==='company'?tr('Hei, aku lagi nggak pengin sendirian. Kamu ada waktu sebentar buat nemenin aku, chat atau telepon?','Hey, I don’t really want to be alone right now. Do you have a little time to keep me company by chat or call?'):tr('Hei, aku lagi kewalahan. Boleh minta bantuan kecil untuk satu hal? Aku akan jelaskan singkat.','Hey, I’m overwhelmed. Could I ask for a small practical favour? I’ll keep it brief.');$('msg').innerHTML=`<div class="message-card"><h3>${tr('Pesan yang bisa langsung dipakai','A message you can use')}</h3><div class="message-preview" id="messageText">${msg}</div><div class="inline-actions"><button class="small-btn" id="copy">${tr('Salin','Copy')}</button><button class="small-btn" id="shareMsg">${tr('Bagikan','Share')}</button></div></div><div class="action-row"><button class="primary" id="done">${tr('Aku tahu siapa yang bisa kuhubungi','I know who I can reach')}</button></div>`;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast(tr('Pesan disalin','Message copied'))}catch(e){toast(tr('Tekan lama untuk menyalin','Press and hold to copy'))}};$('shareMsg').onclick=async()=>{try{if(navigator.share)await navigator.share({text:msg});else await navigator.clipboard.writeText(msg)}catch(e){}};$('done').onclick=()=>change(renderOutcome)})}
function renderAnger(){stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="intervention"><div class="eyebrow">${tr('Jeda sebelum bereaksi','Pause before reacting')}</div><h2>${tr('Untuk satu menit, jangan kirim apa pun.','For one minute, do not send anything.')}</h2><p class="lede">${tr('Letakkan ponsel. Turunkan bahu. Rasakan telapak kaki. Buang napas lebih panjang dari tarikan napas.','Put the phone down. Drop your shoulders. Feel your feet. Let the exhale be longer than the inhale.')}</p><div class="breath-orb" id="angerOrb"><span id="angerWord">60</span></div><button class="primary" id="start">${tr('Mulai jeda 60 detik','Start 60-second pause')}</button></div>`;$('back').onclick=()=>change(renderQuick);$('start').onclick=()=>{let n=60;$('start').disabled=true;breathTimer=setInterval(()=>{n--;if($('angerWord'))$('angerWord').textContent=n;if(n<=0){clearInterval(breathTimer);change(renderOutcome)}},1000)}}
function renderSad(step=0){const steps=[tr('Cari satu tempat tubuhmu ditopang: kursi, lantai, atau tempat tidur. Rasakan tekanannya.','Notice one place your body is supported: chair, floor, or bed. Feel the pressure.'),tr('Lihat sekeliling dan sebutkan tiga benda yang benar-benar ada di depanmu.','Look around and name three objects that are actually in front of you.'),tr('Pikirkan satu orang yang relatif aman untuk dihubungi kalau kamu tidak ingin sendirian.','Think of one relatively safe person you could contact if you do not want to be alone.')];stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="eyebrow">${tr('Lewati beberapa menit ini','Get through the next few minutes')}</div><h2>${steps[step]}</h2><p class="lede">${tr('Tidak perlu memperbaiki semuanya sekarang. Hanya langkah ini.','You do not need to fix everything right now. Just this step.')}</p><div class="stepper">${steps.map((_,i)=>`<span class="step-dot ${i<step?'done':i===step?'active':''}"></span>`).join('')}</div><div class="action-row"><button class="primary" id="done">${step===2?tr('Sudah','Done'):tr('Sudah, lanjut','Done, next')}</button></div>`;$('back').onclick=()=>step===0?change(renderQuick):renderSad(step-1);$('done').onclick=()=>step<2?renderSad(step+1):change(renderOutcome)}
function renderOutcome(){current='outcome';stage.innerHTML=`<div class="eyebrow">${tr('Cek sebentar','Quick check')}</div><h2>${tr('Apakah ini membantu sedikit?','Did that help at all?')}</h2><p class="lede">${tr('Tidak harus merasa baik. Kita hanya mengecek apakah langkah tadi berguna.','You do not need to feel good. We are only checking whether that step was useful.')}</p><div class="outcome-grid"><button class="outcome" data-o="helped">${tr('Ya, membantu','Yes, it helped')}</button><button class="outcome" data-o="little">${tr('Sedikit','A little')}</button><button class="outcome" data-o="notyet">${tr('Belum','Not yet')}</button><button class="outcome" data-o="worse">${tr('Malah lebih berat','I feel worse')}</button></div>`;stage.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{state.clarity=b.dataset.o;if(state.clarity==='worse')change(renderWorse);else finishAndSave('intervention')})}
function renderWorse(){stage.innerHTML=`<div class="eyebrow">${tr('Jangan dipaksa','Do not force it')}</div><h2>${tr('Kalau terasa lebih berat, kita ganti arah.','If it feels heavier, let’s change direction.')}</h2><p class="lede">${tr('Kamu bisa berhenti, menghubungi seseorang, atau melihat bantuan langsung.','You can stop, reach someone, or see direct support.')}</p><div class="choice-grid"><button class="choice" id="person"><span><strong>${tr('Bantu aku menghubungi seseorang','Help me reach someone')}</strong></span><span class="round">→</span></button><button class="choice" id="help"><span><strong>${tr('Lihat bantuan langsung','See direct help')}</strong></span><span class="round">→</span></button><button class="choice" id="stop"><span><strong>${tr('Berhenti untuk sekarang','Stop for now')}</strong></span><span class="round">→</span></button></div>`;$('person').onclick=()=>{state.need='connect';flowMode='quick';change(renderConnect)};$('help').onclick=()=>change(renderHelp);$('stop').onclick=()=>finishAndSave('stopped')}
function renderFinish(){current='finish';const positive=isBright(),steady=state.weather==='okay'&&isGentleOkay();stage.innerHTML=`<div class="finish"><div class="finish-core"></div><div class="eyebrow">${tr('Cukup untuk sekarang','Enough for now')}</div><h2>${steady?tr('Hari yang cukup stabil juga layak diingat.','A steady-enough day is worth noticing too.'):positive?tr('Bawa yang baiknya. Tidak perlu menahannya.','Carry what was good. You do not need to hold onto it.'):tr('Kembali ke harimu.','Return to your day.')}</h2><p class="lede" style="max-width:510px">${positive?tr('Cuaca Jiwa menyimpan satu petunjuk tanpa mengubahnya menjadi kesimpulan.','Cuaca Jiwa saved one clue without turning it into a conclusion.'):tr('Tidak semua hal harus selesai sekarang. Sedikit lebih tenang, jelas, atau terhubung sudah cukup.','Not everything has to be solved now. A little more calm, clarity, or connection is enough.')}</p><div class="action-row" style="width:min(100%,430px)"><button class="primary" id="home">${tr('Selesai','Done')}</button><button class="ghost" id="history">${tr('Lihat Cuacaku','See My Weather')}</button></div></div>`;$('home').onclick=()=>{state=blank();document.body.dataset.weather='okay';change(renderHome)};$('history').onclick=()=>change(renderHistory)}
function saveSession(tag){const rec={id:'cj6_'+Date.now().toString(36),date:new Date().toISOString(),weather:state.weather,feelings:[...state.feelings],comboKey:state.comboKey,comboFeedback:state.comboFeedback,happySource:state.happySource,happyFactor:state.happyFactor,context:state.context,need:state.need,clarity:state.clarity,intervention:state.intervention||tag,emotionReadMethod:'valence-arousal-v1',version:6};const all=sessions();all.unshift(rec);try{localStorage.setItem('cuacaJiwaSessionsV6',JSON.stringify(all.slice(0,150)))}catch(e){}}
function sessions(){try{return JSON.parse(localStorage.getItem('cuacaJiwaSessionsV6')||'[]')}catch(e){return[]}}
function finishAndSave(tag){saveSession(tag);change(renderFinish)}
function topKey(arr,key){const c={};arr.forEach(x=>{if(x[key])c[x[key]]=(c[x[key]]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]}
function recurringPair(data){const c={};data.forEach(r=>{const fs=(r.feelings||[]).filter(x=>!['mixed','unsure'].includes(x));for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){const k=[fs[i],fs[j]].sort().join('|');c[k]=(c[k]||0)+1}});const x=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return x&&x[1]>=2?x:null}
function recordFeelNames(r){return (r.feelings||[]).map(k=>feelName(k,r.weather)).join(' · ')}
function renderHistory(){current='history';const data=sessions();const positive=data.filter(r=>['sunny','okay'].includes(r.weather)&&r.happyFactor),contexts=data.filter(r=>r.context),helpful=data.filter(r=>['helped','little'].includes(r.clarity)&&r.need),pair=recurringPair(data);const pf=topKey(positive,'happyFactor')?.[0],ctx=topKey(contexts,'context')?.[0],need=topKey(helpful,'need')?.[0];const f=pf?[...OUTER,...INNER].find(x=>x[0]===pf):null,c=ctx?CONTEXT.find(x=>x[0]===ctx):null,n=need?NEEDS.find(x=>x[0]===need):null;let pairHTML='';if(pair){const [a,b]=pair[0].split('|'),sample=data.find(r=>(r.feelings||[]).includes(a)&&(r.feelings||[]).includes(b));pairHTML=`<div class="history-pair"><strong>${tr('Kombinasi yang mulai berulang','A combination that is starting to repeat')}</strong><p>${feelName(a,sample?.weather)} + ${feelName(b,sample?.weather)} · ${pair[1]}×. ${tr('Ini hanya pola dari check-inmu, bukan label baru tentang dirimu.','This is only a pattern in your check-ins, not a new label about you.')}</p></div>`}stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="history-head"><div class="eyebrow">${tr('Pola, bukan penilaian','Patterns, not judgement')}</div><h2>${tr('Cuacaku','My Weather')}</h2><p class="lede">${tr('Yang penting bukan hanya seberapa sering kamu merasa sesuatu, tetapi apa yang muncul bersama, apa yang membantu, dan apa yang mendukung hari yang lebih baik.','What matters is not only how often you feel something, but what appears together, what helps, and what supports better days.')}</p><div class="climate"><span class="climate-sun"></span><span class="climate-cloud"></span><span class="climate-rain"></span></div></div>${!data.length?`<div class="insight-card"><strong>${tr('Belum ada pola.','No patterns yet.')}</strong><p>${tr('Beberapa check-in akan mulai membentuk gambaran.','A few check-ins will start to form a picture.')}</p></div>`:`<div class="insight-stack"><div class="insight-card"><div class="k">${tr('Yang sering mendukungku','What often supports me')}</div><strong>${f?tr(f[1],f[2]):tr('Belum cukup data','Not enough data yet')}</strong><p>${tr('Petunjuk ini berasal dari check-in hari yang cerah atau cukup stabil. Bukan penyebab pasti.','This clue comes from brighter or steadier check-ins. It is not a certain cause.')}</p></div><div class="insight-card"><div class="k">${tr('Yang sering membebaniku','What often weighs on me')}</div><strong>${c?tr(c[1],c[2]):tr('Belum cukup data','Not enough data yet')}</strong></div><div class="insight-card"><div class="k">${tr('Yang tampaknya membantu','What seems to help')}</div><strong>${n?tr(n[1],n[2]):tr('Belum cukup data','Not enough data yet')}</strong><p>${tr('Berdasarkan sesi yang kamu sendiri nilai membantu atau sedikit membantu.','Based on sessions you yourself rated helpful or a little helpful.')}</p></div></div>${pairHTML}<div class="history-list">${data.slice(0,10).map(r=>`<div class="history-row"><strong>${r.weather?weatherName(r.weather):tr('Bantuan cepat','Quick help')}</strong><span>${new Date(r.date).toLocaleDateString(lang==='id'?'id-ID':'en-US',{day:'numeric',month:'short'})}${(r.feelings||[]).length?' · '+recordFeelNames(r):''}</span></div>`).join('')}</div><button class="ghost" id="clear" style="margin-top:18px">${tr('Hapus riwayat di perangkat ini','Delete history on this device')}</button>`}`;$('back').onclick=()=>change(renderHome);if($('clear'))$('clear').onclick=()=>{if(confirm(tr('Hapus semua riwayat di perangkat ini?','Delete all history on this device?'))){localStorage.removeItem('cuacaJiwaSessionsV6');renderHistory()}}}
function renderHelp(){stage.innerHTML=`<button class="ghost" id="back">← ${tr('Kembali','Back')}</button><div class="eyebrow">${tr('Bantuan & keselamatan','Help & safety')}</div><h2>${tr('Cuaca Jiwa bukan layanan darurat atau diagnosis.','Cuaca Jiwa is not emergency care or a diagnosis.')}</h2><p class="lede">${tr('Kalau kamu membutuhkan bantuan langsung, gunakan layanan yang bisa merespons secara nyata.','If you need immediate help, use a service that can respond in the real world.')}</p><a class="resource" href="https://healing119.id" target="_blank" rel="noopener"><strong>Healing119</strong><span>${tr('Dukungan psikologis awal; tersedia melalui situs dan 119 ekstensi 8.','Psychological first support; available through the website and 119 extension 8.')}</span></a><a class="resource" href="tel:119"><strong>PSC 119</strong><span>${tr('Darurat medis di Indonesia.','Medical emergency support in Indonesia.')}</span></a><div class="notice">${tr('Jika memungkinkan, beri tahu seseorang yang kamu percaya dan jangan hadapi situasi berbahaya sendirian.','If possible, tell someone you trust and do not face a dangerous situation alone.')}</div>`;$('back').onclick=()=>change(renderHome)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
$('historyBtn').onclick=()=>change(renderHistory);$('langBtn').onclick=()=>{lang=lang==='id'?'en':'id';$('langBtn').textContent=lang==='id'?'EN':'ID';const fn={home:renderHome,feelings:renderFeelings,happySource:renderHappySource,happyFactor:renderHappyFactor,happyLanding:renderHappyLanding,savour:renderSavour,context:renderContext,needs:renderNeeds,quick:renderQuick,intervention:renderIntervention,outcome:renderOutcome,finish:renderFinish,history:renderHistory}[current]||renderHome;fn()};
let hold;document.querySelector('.brand').addEventListener('pointerdown',()=>hold=setTimeout(()=>change(renderHelp),800));['pointerup','pointerleave'].forEach(e=>document.querySelector('.brand').addEventListener(e,()=>clearTimeout(hold)));
window.CuacaJiwaV06={version:'0.6',state:()=>({...state}),sessions,comboReading,renderHome,renderHistory,setFeeling};renderHome();
</script>
